# POOLROOMS — статический сайт для nginx.
#
# Установка:
#   sudo cp deploy/nginx-poolrooms.conf /etc/nginx/sites-available/poolrooms
#   sudo ln -s /etc/nginx/sites-available/poolrooms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (после того как домен указывает на сервер):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d poolrooms.example.com
#   certbot сам допишет 443-й server-блок и продление сертификата.

server {
    listen 80;
    listen [::]:80;
    server_name poolrooms.example.com;   # или _  — дефолтный сервер по IP

    root /var/www/poolrooms;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # html правится при пересборке — короткий кэш вместо вечного
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
    }
}
