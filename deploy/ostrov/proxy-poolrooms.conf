# POOLROOMS — вставляется в конец /srv/infrastructure/proxy.conf.
# Существующие домены этот блок не затрагивает: добавляется только своё имя.
server {
    listen 80;
    server_name poolrooms.ostrov-vezeniya.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name poolrooms.ostrov-vezeniya.ru;

    ssl_certificate     /etc/letsencrypt/live/poolrooms.ostrov-vezeniya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poolrooms.ostrov-vezeniya.ru/privkey.pem;

    # Сетевая игра. Отдельным блоком, потому что в location / стоит
    # Connection "" — он нужен для gzip, но убивает рукопожатие вебсокета.
    location ^~ /ws/ {
        proxy_pass http://172.17.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://172.17.0.1:8083;
        # без этого прокси идёт к апстриму по HTTP/1.0, и тот отказывается жать
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
