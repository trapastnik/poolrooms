server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # центральный прокси gzip не включает, а game.html ~680 КБ — жмём здесь
    gzip on;
    # прокси впереди ходит по HTTP/1.0, а nginx по умолчанию жмёт только с 1.1
    gzip_http_version 1.0;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Таблица результатов. ^~ обязателен: иначе правило-регексп ниже перехватит
    # запрос раньше и проксирование не сработает.
    location ^~ /api/ {
        # Имя апстрима резолвим на каждый запрос, а не один раз при старте.
        # Иначе после пересоздания контейнера nginx держит его старый адрес —
        # а тот может достаться другому сервису, и запросы уходят не туда.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_up api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_up:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Сетевая игра. Upgrade и Connection обязательны, иначе рукопожатие
    # вебсокета не проходит и соединение рвётся сразу после ответа 200.
    location ^~ /ws/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $rt_up realtime;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass http://$rt_up:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;      # игрок может стоять на месте долго
    }

    # Служебные файлы лежат в той же папке, что и статика, — наружу их не отдаём
    location ~ ^/(data/|api/|Dockerfile|docker-compose\.yml|nginx\.conf|\.env) {
        deny all;
    }

    # музыка не меняется — пусть лежит в кэше браузера подольше.
    # webm здесь всегда звук, поэтому тип задаём явно: по умолчанию nginx
    # отдал бы video/webm, а это сбивает с толку часть плееров.
    location = /assets/music.webm {
        # именно types, а не default_type: у nginx .webm уже прописан как
        # video/webm, и default_type такую запись не перебивает
        types { audio/webm webm; }
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~* \.(mp3|ogg|opus)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Игра пересобирается часто, и пятиминутный кэш успевал отдавать вчерашнюю
    # сборку — с проверками это путало. no-cache не запрещает кэш, а требует
    # каждый раз переспросить сервер: не изменилось — придёт 304, дёшево.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        # nginx не наследует add_header в блок, где есть свои add_header, —
        # поэтому заголовки безопасности повторяем здесь, а не только в server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
