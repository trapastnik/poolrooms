<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POOLROOMS — сервер</title>
<style>
  :root{
    --bg:#05090b; --fg:#dfeef0; --dim:#7f9498; --acc:#6fe3e8; --acc2:#2a5c62;
    --panel:rgba(8,16,19,.82); --line:rgba(111,227,232,.22);
    --ok:#8fe8b4; --warn:#e8c04c; --hot:#e8604c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100%;background:var(--bg);color:var(--fg);
    background-image:radial-gradient(120% 90% at 50% 0%,rgba(20,52,58,.5),transparent 70%);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;padding:28px 20px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:26px;font-weight:200;letter-spacing:.3em;text-transform:uppercase;
    background:linear-gradient(180deg,#eafeff,#6fe3e8);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    margin:4px 0 26px}
  h2{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--acc);opacity:.85;margin:0 0 12px}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    align-items:start}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .box.wide{grid-column:1 / -1}

  .row{display:flex;align-items:center;gap:8px;white-space:nowrap;
    font-size:13px;color:var(--dim);padding:5px 0}
  .row .k{flex:0 0 auto;min-width:96px}
  .row .v{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
  .row b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .dim{color:var(--dim);opacity:.75}
  .bar{flex:0 0 auto;width:110px;height:6px;border-radius:3px;
    background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
  .bar i.warn{background:var(--warn)} .bar i.hot{background:var(--hot)}

  .big{font-size:30px;font-weight:200;color:var(--fg);font-variant-numeric:tabular-nums}
  .big small{font-size:13px;color:var(--dim);letter-spacing:.1em;margin-left:6px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
  tr:last-child td{border-bottom:none}
  td.n{color:var(--dim);width:34px;font-variant-numeric:tabular-nums}
  td.s{color:var(--acc);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}

  .pill{display:inline-block;font-size:11px;letter-spacing:.1em;padding:3px 10px;
    border-radius:12px;border:1px solid var(--line);color:var(--dim)}
  .pill.on{color:var(--ok);border-color:rgba(143,232,180,.5)}
  .pill.off{color:var(--hot);border-color:rgba(232,96,76,.5)}

  #chart svg{width:100%;height:auto;display:block}

  /* вход по PIN */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%,rgba(20,52,58,.55),rgba(3,7,9,.96));
    backdrop-filter:blur(10px);z-index:20}
  #gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px 34px;text-align:center;width:min(360px,92vw)}
  input{font:inherit;color:var(--fg);background:rgba(255,255,255,.05);letter-spacing:.5em;
    border:1px solid var(--line);border-radius:9px;padding:12px 14px;outline:none;
    width:150px;text-align:center;font-size:20px;margin:16px 0 4px}
  input:focus{border-color:var(--acc)}
  button{font:inherit;color:var(--fg);background:rgba(111,227,232,.14);cursor:pointer;
    border:1px solid var(--line);border-radius:10px;padding:11px 26px;transition:.16s;
    letter-spacing:.08em;font-weight:600}
  button:hover{background:rgba(111,227,232,.24);border-color:var(--acc)}
  .err{color:var(--hot);font-size:12px;min-height:18px;margin-top:8px}
  .btnrow{display:flex;align-items:center;flex-wrap:wrap}
  #netToggle{padding:9px 18px;font-size:13px}
  .foot{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-top:22px;text-align:center}
  a{color:var(--acc)}
</style>
</head>
<body>

<div class="wrap">
  <h1>Сервер</h1>
  <div class="sub">Poolrooms · <span id="host"></span> · обновлено <span id="upd">—</span></div>

  <div class="grid">
    <div class="box">
      <h2>Нагрузка машины</h2>
      <div id="load"></div>
    </div>

    <div class="box">
      <h2>Сетевая игра</h2>
      <div id="net"></div>
      <div class="btnrow" style="margin-top:12px">
        <button id="netToggle">—</button>
        <span id="netMsg" class="dim" style="font-size:12px;margin-left:10px"></span>
      </div>
    </div>

    <div class="box">
      <h2>Сейчас в игре</h2>
      <div class="big" id="onlineBig">—</div>
      <div id="online"></div>
    </div>

    <div class="box">
      <h2>Забеги</h2>
      <div class="big" id="totalBig">—<small>всего</small></div>
      <div id="chart"></div>
    </div>

    <div class="box wide">
      <h2>Таблица результатов</h2>
      <div id="board"></div>
    </div>
  </div>

  <div class="foot">
    Обновляется каждые 6 секунд · <a href="game.html">в игру</a> · <a href="editor.html">редактор</a>
  </div>
</div>

<div id="gate">
  <div class="card">
    <h1 style="font-size:20px">Сервер</h1>
    <div class="sub" style="margin:6px 0 0">введите PIN доступа</div>
    <div><input id="pin" inputmode="numeric" maxlength="6" placeholder="····" autocomplete="off"></div>
    <div class="err" id="gateErr"></div>
    <button id="go">Войти</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var LS = 'poolrooms.statsPin';
  var $ = function (id) { return document.getElementById(id); };
  var timer = null;

  function plural(n, one, few, many) {
    var m = n % 10, h = n % 100;
    if (h >= 11 && h <= 14) return many;
    if (m === 1) return one;
    if (m >= 2 && m <= 4) return few;
    return many;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function bar(frac) {
    var pct = Math.max(0, Math.min(1, frac)) * 100;
    var cls = pct > 85 ? 'hot' : pct > 60 ? 'warn' : '';
    return '<span class="bar"><i class="' + cls + '" style="width:' + pct.toFixed(0) + '%"></i></span>';
  }
  function row(k, v) { return '<div class="row"><span class="k">' + k + '</span>' + v + '</div>'; }

  function drawLoad(h) {
    if (!h) { $('load').innerHTML = '<div class="empty">нет данных</div>'; return; }
    var out = '';
    if (h.load) {
      var per = h.load[0] / (h.cpus || 1);
      out += row('Процессор', bar(per) + '<b>' + (per * 100).toFixed(0) + '%</b>'
        + '<span class="v dim">' + h.load.map(function (v) { return v.toFixed(2); }).join(' / ')
        + ' на ' + h.cpus + ' ' + plural(h.cpus, 'ядро', 'ядра', 'ядер') + '</span>');
    }
    if (h.memTotalMb) {
      out += row('Память', bar(h.memUsedMb / h.memTotalMb)
        + '<span class="v"><b>' + (h.memUsedMb / 1024).toFixed(1) + '</b> из '
        + (h.memTotalMb / 1024).toFixed(1) + ' ГБ</span>');
    }
    if (h.diskTotalGb) {
      out += row('Диск', bar(1 - h.diskFreeGb / h.diskTotalGb)
        + '<span class="v">свободно <b>' + h.diskFreeGb + '</b> из ' + h.diskTotalGb + ' ГБ</span>');
    }
    if (h.uptimeH != null) {
      var d = Math.floor(h.uptimeH / 24);
      out += row('Аптайм', '<span class="v"><b>' + (d ? d + ' сут ' : '')
        + Math.round(h.uptimeH % 24) + ' ч</b></span>');
    }
    $('load').innerHTML = out || '<div class="empty">нет данных</div>';
  }

  function drawNet(net) {
    var el = $('net');
    if (!net || !net.ok) {
      el.innerHTML = '<div class="row"><span class="k">Состояние</span>'
        + '<span class="pill off">не запущен</span>'
        + '<span class="v dim">поднимается командой docker compose start realtime</span></div>';
      return;
    }
    var rooms = net.rooms || {};
    var names = Object.keys(rooms);
    var total = names.reduce(function (a, k) { return a + (rooms[k].players || 0); }, 0);
    var out = row('Состояние', net.on === false
      ? '<span class="pill off">выключена</span>'
      : '<span class="pill on">работает</span>'
      + '<span class="v dim">до ' + net.max + ' игроков в комнате, комнат до '
      + (net.maxRooms || '?') + '</span>');
    out += row('Игроков', '<span class="v"><b>' + total + '</b> в '
      + names.length + ' из ' + (net.maxRooms || '?') + ' комнат</span>');
    if (net.idleExitMin) {
      out += row('Простой', '<span class="v dim">гаснет через ' + net.idleExitMin
        + ' мин без игроков</span>');
    }
    if (names.length) {
      out += names.map(function (n) {
        var r = rooms[n];
        return row(esc(n), bar(r.players / net.max)
          + '<span class="v"><b>' + r.players + '</b> из ' + net.max + ' · '
          + (r.started ? 'игра идёт' : 'ждут в лобби') + '</span>');
      }).join('');
    } else {
      out += '<div class="empty">комнат нет — никто не подключён</div>';
    }
    el.innerHTML = out;
  }

  var netIsOn = true;
  function drawToggle(net) {
    var b = $('netToggle');
    if (!b) return;
    if (!net || !net.ok) { b.textContent = 'сервис не отвечает'; b.disabled = true; return; }
    b.disabled = false;
    netIsOn = net.on !== false;
    b.textContent = netIsOn ? 'Выключить сетевую игру' : 'Включить сетевую игру';
  }

  function toggleNet() {
    var pin = localStorage.getItem(LS) || '';
    $('netMsg').textContent = 'меняю…';
    fetch('/ws/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Stats-Pin': pin },
      body: JSON.stringify({ on: !netIsOn })
    }).then(function (r) {
      if (r.status === 403) throw new Error('PIN не подошёл');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      $('netMsg').textContent = d.on ? 'включена' : 'выключена, все комнаты закрыты';
      refresh().catch(function () { });
    }).catch(function (e) { $('netMsg').textContent = e.message; });
  }

  function drawOnline(d) {
    $('onlineBig').innerHTML = d.online + '<small>' + plural(d.online, 'человек', 'человека', 'человек') + '</small>';
    var el = $('online');
    if (!d.players || !d.players.length) { el.innerHTML = '<div class="empty">— никого</div>'; return; }
    el.innerHTML = d.players.map(function (p) {
      return row(esc(p.name), '<span class="v dim">'
        + (p.idle > 25 ? p.idle + ' с назад' : 'сейчас') + '</span>');
    }).join('');
  }

  function drawChart(days, total) {
    $('totalBig').innerHTML = total + '<small>всего</small>';
    var keys = Object.keys(days || {}).sort().slice(-14);
    var el = $('chart');
    if (!keys.length) { el.innerHTML = '<div class="empty">забегов ещё не было</div>'; return; }
    var vals = keys.map(function (k) { return days[k]; });
    var max = Math.max.apply(null, vals.concat([1]));
    var H = 90, pad = 14, bw = Math.min(30, (420 - pad * 2) / keys.length);
    var W = Math.max(140, pad * 2 + bw * keys.length);
    var bars = keys.map(function (k, i) {
      var h = Math.max(2, (vals[i] / max) * (H - 32));
      var x = pad + i * bw, y = H - 18 - h;
      var lbl = (i === 0 || i === keys.length - 1) ?
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 5) + '" class="d">' + k.slice(5) + '</text>' : '';
      var num = vals[i] ? '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1)
        + '" class="v">' + vals[i] + '</text>' : '';
      return '<rect x="' + (x + 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw - 4).toFixed(1)
        + '" height="' + h.toFixed(1) + '" rx="2" class="b"/>' + num + lbl;
    }).join('');
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    el.innerHTML = '<div class="row"><span class="k">За ' + keys.length + ' '
      + plural(keys.length, 'день', 'дня', 'дней') + '</span><span class="v"><b>' + sum + '</b></span></div>'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="max-width:' + W + 'px">'
      + '<style>.b{fill:rgba(111,227,232,.55)}'
      + '.v{fill:#dfeef0;font-size:9px;text-anchor:middle;font-family:inherit}'
      + '.d{fill:#7f9498;font-size:9px;text-anchor:middle;font-family:inherit}</style>'
      + bars + '</svg>';
  }

  function drawBoard(rows) {
    var el = $('board');
    if (!rows || !rows.length) { el.innerHTML = '<div class="empty">пока пусто</div>'; return; }
    var mmss = function (s) { return ((s / 60) | 0) + ':' + String(s % 60).padStart(2, '0'); };
    el.innerHTML = '<table><tr><th></th><th>Игрок</th><th>Убито</th><th>Артефактов</th>'
      + '<th>Время</th><th>Сложность</th><th style="text-align:right">Счёт</th></tr>'
      + rows.map(function (r, i) {
        return '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(r.name) + '</td>'
          + '<td>' + r.kills + '</td><td>' + r.artifacts + '</td>'
          + '<td>' + mmss(r.time) + '</td><td class="dim">' + esc(r.diff || '') + '</td>'
          + '<td class="s">' + r.score + '</td></tr>';
      }).join('') + '</table>';
  }

  function refresh() {
    var pin = localStorage.getItem(LS) || '';
    return fetch('/api/stats', { cache: 'no-store', headers: { 'X-Stats-Pin': pin } })
      .then(function (r) {
        if (r.status === 403) { throw new Error('pin'); }
        if (!r.ok) { throw new Error('http ' + r.status); }
        return r.json();
      })
      .then(function (d) {
        $('gate').style.display = 'none';
        $('host').textContent = location.host;
        $('upd').textContent = new Date().toLocaleTimeString('ru-RU');
        drawLoad(d.host);
        drawNet(d.net);
        drawToggle(d.net);
        drawOnline(d);
        drawChart(d.days, d.total != null ? d.total : d.runs);
        drawBoard(d.rows || []);
        if (!timer) timer = setInterval(function () { refresh().catch(function () { }); }, 6000);
      });
  }

  function tryPin() {
    var v = $('pin').value.replace(/\D/g, '');
    if (!v) { $('gateErr').textContent = 'введите PIN'; return; }
    localStorage.setItem(LS, v);
    refresh().catch(function (e) {
      localStorage.removeItem(LS);
      $('gateErr').textContent = e.message === 'pin' ? 'PIN не подошёл' : 'сервер недоступен';
    });
  }

  $('go').addEventListener('click', tryPin);
  $('netToggle').addEventListener('click', toggleNet);
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPin(); });

  // если PIN уже вводили на этом устройстве — входим сразу
  if (localStorage.getItem(LS)) {
    refresh().catch(function () { $('pin').focus(); });
  } else {
    $('pin').focus();
  }
})();
</script>
</body>
</html>
